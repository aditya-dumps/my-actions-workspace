name: Ubuntu Workspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: SSH Breakpoint
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 5h
          authorized-keys: ${{ secrets.SSH_PUBLIC_KEY }}
