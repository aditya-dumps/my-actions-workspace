name: Ubuntu Workspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Check Runner Resources
        run: |
          echo "============================================"
          echo "           RUNNER INFORMATION"
          echo "============================================"

          echo
          echo "===== RAM ====="
          free -h

          echo
          echo "===== SWAP ====="
          swapon --show || true

          echo
          echo "===== CPU ====="
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo
          echo "===== DISK ====="
          df -h /

          echo
          echo "===== MEMORY INFO ====="
          cat /proc/meminfo | head -25

          echo
          echo "===== UPTIME ====="
          uptime

          echo
          echo "============================================"
          echo "        END RUNNER INFORMATION"
          echo "============================================"

      - name: Check Kernel Memory Errors
        run: |
          echo "===== OOM / MEMORY ERRORS ====="
          dmesg -T 2>/dev/null | grep -iE \
            "oom|out of memory|killed process|memory cgroup" \
            || echo "No OOM messages found."

          echo
          echo "===== KERNEL TERMINATION MESSAGES ====="
          dmesg -T 2>/dev/null | grep -iE \
            "killed|terminated|sigterm|signal" \
            || echo "No termination messages found."

      - name: SSH Breakpoint
        uses: namespacelabs/breakpoint-action@v0
        with:
          duration: 5h
          authorized-keys: ${{ secrets.SSH_PUBLIC_KEY }}
