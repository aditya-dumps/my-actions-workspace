name: Ubuntu Workspace

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Run custom commands
        run: |
          echo "Ready to run your commands!"
          uname -a
          whoami