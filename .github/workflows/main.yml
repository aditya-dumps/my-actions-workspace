name: Ubuntu Workspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Upterm
        run: |
          echo "Testing Upterm..."
          getent hosts upterm.dev || true
          curl -I --max-time 10 https://upterm.dev || true

      - name: Start SSH Shell
        uses: owenthereal/action-upterm@v1
        timeout-minutes: 300
