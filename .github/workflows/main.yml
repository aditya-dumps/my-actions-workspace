name: Ubuntu Workspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test network
        run: |
          echo "=== Testing GitHub ==="
          curl -I --max-time 10 https://github.com

          echo "=== Testing tmate.io ==="
          curl -I --max-time 10 https://tmate.io

          echo "=== Resolving tmate.io ==="
          getent hosts tmate.io

      - name: Start tmate
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 300
