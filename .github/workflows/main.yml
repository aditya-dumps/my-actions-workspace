name: Ubuntu Workspace

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Upterm
        run: |
          curl -L https://github.com/owenthereal/upterm/releases/latest/download/upterm_linux_x86_64.tar.gz -o /tmp/upterm.tar.gz
          tar -xzf /tmp/upterm.tar.gz -C /tmp
          sudo install /tmp/upterm /usr/local/bin/upterm
          upterm --version

      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/upterm_key
          chmod 600 ~/.ssh/upterm_key

      - name: Start Upterm
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan uptermd.upterm.dev >> ~/.ssh/known_hosts

          upterm host \
            --accept \
            --private-key ~/.ssh/upterm_key \
            --skip-host-key-check \
            --authorized-keys ~/.ssh/upterm_key.pub \
            --join-timeout 300m \
            -- bash
